# config-bigger-er.yml

# In a YAML file, text after a # is ignored!

# These are the entrances types in entrance.yml
# BASICALLY: uncomment any entrance types you don't want plotted on the graph.
#      E.G: if you don't have grotto shuffle enabled, uncomment the four grotto entrance types.
# How this works:
#      We load OoTMM's complete logical map of the games, then we make incisions based on entrances.yml
#      Any areas that are still connected after incisions will become one node in the graph.
#      When you add an entrance type to ignore-entrance-types, you stop those entrances being used to make incisions.
#      Thus if you were to ignore grottos, then grottos would still be attached to their normal places after incisions.
#      And thus grottos don't get their own nodes in the graph.
# This 'ignore' behaviour can be overriden by "entrance-whitelist" (below)
ignore-entrances-types:
#  - none   # Don't know what this is for

