#############################################################################################################

## List of entrances to render even if they are set to be ignored by ignore-entrance-types
# Usually these come in pairs
entrance-whitelist:
  - OOT_TEMPLE_OF_TIME
  - OOT_TEMPLE_OF_TIME_ENTRYWAY_FROM_TEMPLE
  
# Stops Kakariko Village and Graveyard from merging because of Dampe's Grave
  - OOT_WINDMILL
  - OOT_KAKARIKO_FROM_WINDMILL
  - OOT_GRAVE_DAMPE
  - OOT_GRAVE_EXIT_DAMPE
  
# Stops termina field and clock town merging because of the Bomber's Passage interior.
  - MM_ASTRAL_OBSERVATORY_FROM_CLOCK_TOWN_EAST
  - MM_CLOCK_TOWN_EAST_FROM_ASTRAL_OBSERVATORY
  - MM_ASTRAL_OBSERVATORY_FROM_FIELD
  - MM_FIELD_FROM_ASTRAL_OBSERVATORY

